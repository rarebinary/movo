name: Movo
options:
  bundleIdPrefix: dev.rarebinary
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: false
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 26.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: false
    DEAD_CODE_STRIPPING: true
    CLANG_ENABLE_MODULES: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
targets:
  MovoCore:
    type: framework
    platform: macOS
    sources:
      - path: MovoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rarebinary.MovoCore
        DEFINES_MODULE: true
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: true
  Movo:
    type: application
    platform: macOS
    info:
      path: MovoApp/Info.plist
      properties:
        CFBundleDisplayName: Movo
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: Copyright © 2026 Yann. All rights reserved.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
    sources:
      - path: MovoApp
    dependencies:
      - target: MovoCore
      - target: MovoWallpaperSPI
      - target: MovoWallpaperExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rarebinary.Movo
        PRODUCT_NAME: Movo
        GENERATE_INFOPLIST_FILE: true
        ENABLE_APP_SANDBOX: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    scheme:
      testTargets:
        - MovoCoreTests
        - MovoWallpaperSPITests
  MovoWallpaperSPI:
    type: framework
    platform: macOS
    sources:
      - path: MovoWallpaperSPI
    dependencies:
      - target: MovoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rarebinary.MovoWallpaperSPI
        DEFINES_MODULE: true
        SKIP_INSTALL: true
        GENERATE_INFOPLIST_FILE: true
  MovoWallpaperExtension:
    type: extensionkit-extension
    platform: macOS
    info:
      path: MovoWallpaperExtension/Info.plist
      properties:
        CFBundleDisplayName: Movo Wallpaper
        CFBundlePackageType: XPC!
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.wallpaper
    entitlements:
      path: MovoWallpaperExtension/MovoWallpaperExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
    sources:
      - path: MovoWallpaperExtension
        excludes:
          - Info.plist
          - MovoWallpaperExtension.entitlements
    dependencies:
      - target: MovoWallpaperSPI
        embed: true
      - target: MovoCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rarebinary.Movo.wallpaper-extension
        PRODUCT_NAME: MovoWallpaperExtension
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  MovoCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MovoCoreTests
    dependencies:
      - target: MovoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rarebinary.MovoCoreTests
        GENERATE_INFOPLIST_FILE: true
  MovoWallpaperSPITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MovoWallpaperSPITests
    dependencies:
      - target: MovoWallpaperSPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rarebinary.MovoWallpaperSPITests
        GENERATE_INFOPLIST_FILE: true
